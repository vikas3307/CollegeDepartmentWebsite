<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Contact Us</h1>
        <p>Computer Science and AI Department | SR University</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="faculty.html">Faculty</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">
        <section>
            <h2>Department Contact Details</h2>
            <p>University: SR University</p>
            <p>Location: Telangana, India</p>
            <p>Email: Add the official department email here.</p>
        </section>

        <section>
            <h2>Send an Enquiry</h2>
            <form>
                <p><label for="name">Name:</label></p>
                <input id="name" type="text" placeholder="Enter your name" required>

                <p><label for="email">Email:</label></p>
                <input id="email" type="email" placeholder="Enter your email" required>

                <p><label for="message">Message:</label></p>
                <textarea id="message" placeholder="Enter your message" required></textarea>

                <p><button type="submit">Submit</button></p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SR University. All rights reserved.</p>
    </footer>
</body>
</html>
